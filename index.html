function countryOptions(selected){return countries.map(c=>'<option value="'+c[1]+'" '+(selected===c[1]?'selected':'')+'>'+c[0]+' ('+c[1]+')</option>').join('')}
function phoneFields(prefix,selected){return '<div class="grid"><select id="'+prefix+'Country" class="input"><option value="">🌍 Choisis ton pays</option>'+countryOptions(selected||'+226')+'</select><input id="'+prefix+'Phone" class="input" inputmode="tel" placeholder="Numéro de téléphone"></div>'}

function login(){document.getElementById('app').innerHTML=auth('Connexion','Avant le dashboard, vérifie ton identité avec ton pays, ton numéro et ton email.',''+phoneFields('login','+226')+'<input id="email" class="input" type="email" placeholder="Adresse email"><button class="btn primary full" onclick="emailLogin()">Continuer avec mon email</button><div class="divider">ou</div><button class="btn white full" style="border:1px solid #d8dee8" onclick="googleLogin()">🔵 Continuer avec Google</button><p class="center muted">Nouveau sur SiteMaker ? <button class="link" onclick="s.screen=\'signup\';render()">Créer un compte</button></p><div class="notice"><b>🌍 International :</b> SiteMaker est ouvert à tous les pays. Sélectionne ton pays pour utiliser automatiquement son indicatif téléphonique.</div><div class="support">Support : <b>'+C.email+'</b></div>')}

async function emailLogin(){let e=document.getElementById('email').value.trim(),phone=fullPhone('login');if(!phone)return alert('Choisis ton pays et entre ton numéro de téléphone.');if(!e||!e.includes('@'))return alert('Entre une adresse email valide.');let cc=document.getElementById('loginCountry').value;s.user={email:e,name:e.split('@')[0],initial:e[0].toUpperCase(),phone:phone,countryCode:cc};s.verified=false;s.code='';s.aiReadyAt=0;s.aiStarted=false;s.codeNotice='Envoi du code de vérification à '+e+'…';codeMode='email';save();s.screen='code';render();await sendEmailCode(e)}
async function apiFetch(url, options){
  if(location.protocol!=='http:' && location.protocol!=='https:'){
    throw new Error('Le serveur SiteMaker n’est pas connecté. Ouvre le site depuis son adresse http:// ou https:// avec le serveur démarré. Un fichier content:// ne peut pas accéder à l’espace agent/développeur.');
  }
  return fetch(url, options);
}

async function sendEmailCode(e){if(emailSendBusy)return;emailSendBusy=true;try{if(location.protocol==='file:'){s.codeNotice='ℹ️ Mode hors-ligne : le vrai e-mail nécessite le serveur. Le bouton IA reste disponible après le compte à rebours.';save();render();return}let r=await apiFetch('/api/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur d’envoi');s.code='';s.codeNotice='✅ Un code de vérification vient réellement d’être envoyé à '+e+'. Vérifie aussi les spams. S’il ne vient pas, utilise « Générer mon code avec IA ».';save();render()}catch(err){s.codeNotice='⚠️ L’envoi automatique n’a pas abouti. Vérifie ta boîte mail et les spams, puis utilise « Générer mon code avec IA ». ';save();render()}finally{emailSendBusy=false}}
function googleLogin(){let e=prompt('Choisis ou saisis ton adresse Gmail :','');if(!e||!e.includes('@'))return alert('Entre une adresse Google valide.');let n=prompt('Entre ton prénom / nom d’utilisateur :',e.split('@')[0]);if(!n)return alert('Le nom d’utilisateur est obligatoire.');let cc=prompt('Entre l’indicatif de ton pays (ex. +226, +225, +33, +1) :','+226');if(!cc)return alert('L’indicatif du pays est obligatoire.');let w=prompt('Entre ton numéro de téléphone sans l’indicatif :','');if(!w)return alert('Le numéro de téléphone est obligatoire.');let phone=(cc.startsWith('+')?cc:'+'+cc)+' '+w.replace(/\D/g,'');s.user={email:e.trim(),name:n.trim(),phone:phone,countryCode:cc,whatsapp:phone,initial:n.trim()[0].toUpperCase()};s.verified=false;s.code='';s.aiReadyAt=0;s.aiStarted=false;s.codeNotice='Envoi du code de vérification à '+e.trim()+'…';save();s.screen='code';render();sendEmailCode(e.trim())}
async function signupGo(){let n=document.getElementById('name').value.trim(),phone=fullPhone('signup'),e=document.getElementById('email').value.trim(),cc=document.getElementById('signupCountry').value;if(!n||!phone||!e||!cc)return alert('Remplis tous les champs et sélectionne ton pays.');s.user={name:n,phone:phone,countryCode:cc,email:e,initial:n[0].toUpperCase(),whatsapp:phone};s.verified=false;s.code='';s.aiReadyAt=0;s.aiStarted=false;s.codeNotice='Envoi du code de vérification à '+e+'…';codeMode='email';save();s.screen='code';render();await sendEmailCode(e)}
function code(){if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}let notice=s.codeNotice||('Un code de vérification est envoyé à '+(s.user?.email||'ton email')+'.');let remaining=s.aiReadyAt?Math.max(0,Math.ceil((s.aiReadyAt-Date.now())/1000)):0;let waiting=remaining>0;document.getElementById('app').innerHTML=auth('Vérification de ton compte',notice,'<div class="notice"><b>📧 Vérification email :</b> un vrai code est envoyé par le serveur à ta boîte mail. Tu peux saisir ce code dès que tu le reçois.</div><input id="verify" class="input" inputmode="numeric" maxlength="6" placeholder="Entre le code reçu par email"><button class="btn primary full" onclick="verify()">🔐 Vérifier mon code</button><div class="codebox"><b>🤖 Code de secours avec IA</b><p class="muted">Si tu n’as pas reçu le code par e-mail, appuie sur le bouton. Le code sera généré après le compte à rebours.</p><button id="aiBtn" class="btn green full" onclick="genCode()" '+(waiting?'disabled style="opacity:.65;cursor:not-allowed"':'')+'>'+ (waiting?'⏳ Génération disponible dans '+remaining+' s':'✨ Générer mon code avec IA') +'</button><div id="aiCountdown" class="code">'+(s.code||'••••••')+'</div></div><p class="muted" style="font-size:11px">Le dashboard reste verrouillé jusqu’à la validation du code.</p>');if(waiting){countdownTimer=setInterval(function(){let r=Math.max(0,Math.ceil((s.aiReadyAt-Date.now())/1000));let b=document.getElementById('aiBtn');if(!b){clearInterval(countdownTimer);countdownTimer=null;return;}if(r>0){b.disabled=true;b.style.opacity='.65';b.style.cursor='not-allowed';b.textContent='⏳ Génération disponible dans '+r+' s';}else{clearInterval(countdownTimer);countdownTimer=null;b.disabled=false;b.style.opacity='1';b.style.cursor='pointer';b.textContent='✨ Générer mon code avec IA';s.code='';s.aiReadyAt=0;s.aiStarted=false;codeMode='ai';s.codeNotice='🤖 Génération du code de secours…';save();fallbackCode();}} ,250);}}
async function fallbackCode(){try{let r=await apiFetch('/api/generate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:s.user.email})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');s.code=String(d.code);s.aiReadyAt=0;s.codeNotice='🤖 Le code de secours est disponible immédiatement. Entre-le pour ouvrir ton dashboard.';save();render()}catch(e){s.code=String(Math.floor(100000+Math.random()*900000));s.aiReadyAt=0;s.codeNotice='🤖 Code de secours généré immédiatement.';save();render()}}

async function sendAI(){
  const input=document.getElementById('aiInput'); const btn=document.getElementById('aiSend'); if(!input||!btn)return;
  const q=input.value.trim(); if(!q)return;
  if(!Array.isArray(s.aiMessages))s.aiMessages=[];
  s.aiMessages.push({role:'user',content:q}); input.value=''; save();
  const box=document.getElementById('aiMessages'); if(box){box.insertAdjacentHTML('beforeend','<div class="bubble user">'+esc(q)+'</div>');box.scrollTop=box.scrollHeight;}
  btn.disabled=true; btn.style.opacity='.6';
  const typing=document.getElementById('aiTyping'); if(typing)typing.innerHTML='<div class="typing">🤖 L’IA réfléchit…</div>';
  try{
    const r=await apiFetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:s.aiMessages})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Erreur du service IA.');
    s.aiMessages.push({role:'assistant',content:d.answer}); save();
    if(box){box.insertAdjacentHTML('beforeend','<div class="bubble ai">'+esc(d.answer)+'</div>');box.scrollTop=box.scrollHeight;}
  }catch(e){
    const msg=e.message||'Impossible de contacter l’IA.'; s.aiMessages.push({role:'assistant',content:'⚠️ '+msg}); save();
    if(box)box.insertAdjacentHTML('beforeend','<div class="bubble ai">⚠️ '+esc(msg)+'</div>');
  }finally{btn.disabled=false;btn.style.opacity='1';if(typing)typing.innerHTML='';}
}

  const cards=toolCards.map(c=>'<div class="mini clickable" onclick="showCardDetail('+JSON.stringify(c[0])+','+JSON.stringify(c[1])+','+JSON.stringify(c[2])+')">'+c[2]+' '+esc(c[0])+'</div>').join('');
  let sitesHtml=sites.length?'<div class="card"><h3>🌐 Mes sites</h3>'+sites.slice().reverse().map(x=>'<div class="mini" style="margin-top:8px"><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.url||'Aperçu local')+'</span><br><a class="btn primary" style="display:inline-block;margin-top:7px;text-decoration:none" target="_blank" href="'+esc(x.url||'#')+'">🔗 Ouvrir le site</a></div>').join('')+'</div>':'';
  let pubsHtml=pubs.length?'<div class="card"><h3>📣 Mes publications</h3>'+pubs.slice().reverse().map(x=>'<div class="mini" style="margin-top:8px"><b>'+esc(x.name)+'</b> · '+money(x.price)+'<br><span class="muted">'+esc(x.url||'Aperçu local')+'</span><br><a class="btn green" style="display:inline-block;margin-top:7px;text-decoration:none" target="_blank" href="'+esc(x.url||'#')+'">🔗 Ouvrir la publication</a></div>').join('')+'</div>':'';
  document.getElementById('app').innerHTML=shell('<main class="content"><div class="card"><span class="tag">CRÉATION</span><h2>Vendeur & créateur</h2><p class="muted">Crée un vrai espace de vente : site web, pages, produits, boutons, réseaux sociaux et liens partageables.</p><div class="grid"><button class="btn primary" onclick="siteWizard()">🌐<br>Créer un site web</button><button class="btn green" onclick="publicationForm()">📣<br>Créer une publication</button></div></div><div class="card"><h3>🧰 Outils du vendeur</h3><p class="muted">Appuie sur une carte pour voir ce qu’elle permet de faire.</p><div class="grid">'+cards+'</div></div><div id="createArea"></div>'+sitesHtml+pubsHtml+'</main>','create');
}

function siteWizard(){document.getElementById('createArea').innerHTML='<div class="card"><span class="tag">🌐 SITE WEB</span><h3>Constructeur de site</h3><p class="muted">Choisis un modèle puis personnalise les outils. Tu peux prévisualiser avant de publier.</p><input id="siteName" class="input" placeholder="Nom de ton site"><textarea id="siteDesc" class="input" rows="3" placeholder="Décris ton activité, tes produits ou services"></textarea><select id="siteTemplate" class="input"><option value="shop">🛒 Boutique / vendeur</option><option value="service">💼 Services / freelance</option><option value="portfolio">🎨 Portfolio / créateur</option><option value="landing">🚀 Présentation / lancement</option></select><input id="siteLogo" class="input" placeholder="Lien de ton logo ou image (facultatif)"><input id="siteColor" class="input" type="color" value="#2459dc"><textarea id="siteSections" class="input" rows="2" placeholder="Sections : Accueil, Produits, À propos, Contact..."></textarea><h4>🔗 Réseaux à afficher</h4><div class="grid"><label class="mini"><input type="checkbox" value="YouTube" class="platform"> ▶️ YouTube</label><label class="mini"><input type="checkbox" value="Instagram" class="platform"> 📷 Instagram</label><label class="mini"><input type="checkbox" value="TikTok" class="platform"> 🎵 TikTok</label><label class="mini"><input type="checkbox" value="WhatsApp" class="platform"> 💬 WhatsApp</label></div><h4>💳 Paiement / retrait</h4><select id="withdrawMethod" class="input"><option>Wave</option><option>Moov Money</option><option>Orange Money</option></select><input id="withdrawNumber" class="input" placeholder="Numéro de retrait"><div class="grid"><button class="btn white" style="border:1px solid #d8dee8" onclick="previewSite()">👁️ Prévisualiser</button><button class="btn primary" onclick="saveSite()">🚀 Publier le site</button></div><div id="sitePreview" class="course"></div></div>'}
function siteData(){let name=document.getElementById('siteName').value.trim(),desc=document.getElementById('siteDesc').value.trim(),template=document.getElementById('siteTemplate').value,logo=document.getElementById('siteLogo').value.trim(),color=document.getElementById('siteColor').value,sections=document.getElementById('siteSections').value.trim(),platforms=[...document.querySelectorAll('.platform:checked')].map(x=>x.value),method=document.getElementById('withdrawMethod').value,num=document.getElementById('withdrawNumber').value.trim();return {name,desc,template,logo,color,sections,platforms,method,num}}
function publicSiteHtml(d){let links=d.platforms.map(x=>'<span style="margin-right:10px">'+esc(x)+'</span>').join('');return '<!doctype html><html lang="fr"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(d.name)+'</title><body style="margin:0;font-family:Arial;background:#f5f7fb;color:#172033"><main style="max-width:760px;margin:auto;padding:24px"><section style="background:'+esc(d.color)+';color:white;border-radius:24px;padding:28px"><div style="font-size:13px;opacity:.85">Site créé avec SiteMaker BF</div>'+(d.logo?'<img src="'+esc(d.logo)+'" alt="logo" style="max-width:120px;max-height:80px;object-fit:contain;margin-top:12px">':'')+'<h1>'+esc(d.name)+'</h1><p>'+esc(d.desc)+'</p></section><section style="background:white;border-radius:20px;padding:22px;margin-top:16px"><h2>Nos outils</h2><p>🛒 Produits · 📱 Réseaux sociaux · 💬 Contact · 💳 Paiement</p><p>'+esc(d.sections||'Accueil · Produits · À propos · Contact')+'</p></section><section style="background:white;border-radius:20px;padding:22px;margin-top:16px"><h2>Nous trouver</h2><p>'+links+'</p><p>Retrait : '+esc(d.method)+' · '+esc(d.num)+'</p></section></main></body></html>'}
function makeLocalLink(html){try{return URL.createObjectURL(new Blob([html],{type:'text/html'}))}catch(e){return 'data:text/html;charset=utf-8,'+encodeURIComponent(html)}}
async function publishSiteServer(d){let r=await apiFetch('/api/publish-site',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,email:s.user.email})});let j=await r.json();if(!r.ok)throw new Error(j.error||'Impossible de publier le site');return j.url}
async function saveSite(){let d=siteData();if(!d.name||!d.desc||!d.platforms.length||!d.num)return alert('Remplis le nom, la description, au moins un réseau et le numéro de retrait.');try{let url=await publishSiteServer(d);let item={...d,url,createdAt:new Date().toLocaleString('fr-FR')};s.sites.push(item);s.pubs++;s.activity.push('Site publié : '+d.name+' · lien créé');await syncAccount();save();document.getElementById('createArea').innerHTML='<div class="card"><h3>✅ Site publié</h3><p class="muted">Voici le lien de ton site.</p><input class="input" value="'+esc(url)+'" readonly onclick="this.select()"><a class="btn primary full" target="_blank" href="'+esc(url)+'">🌐 Ouvrir mon site</a><button class="btn white full" style="border:1px solid #d8dee8" onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify(url)+').then(()=>alert(\'Lien copié.\'))">📋 Copier le lien</button></div>';}catch(e){alert(e.message)}}
function previewSite(){let d=siteData();if(!d.name||!d.desc)return alert('Ajoute au moins le nom et la description.');let box=document.getElementById('sitePreview');box.innerHTML='<b>Aperçu :</b><div style="margin-top:8px;padding:15px;border-radius:14px;background:'+esc(d.color)+';color:white"><h3>'+esc(d.name)+'</h3><p>'+esc(d.desc)+'</p></div><p class="muted">Modèle : '+esc(d.template)+' · Sections : '+esc(d.sections||'Accueil, Produits, Contact')+'</p>'}
function publicationForm(){document.getElementById('createArea').innerHTML='<div class="card"><span class="tag">📣 PUBLICATION</span><h3>Constructeur de publication</h3><p class="muted">Crée une fiche de vente partageable avec image, prix, contact et réseaux.</p><input id="prod" class="input" placeholder="Nom du produit / service"><textarea id="pubDesc" class="input" rows="3" placeholder="Description détaillée"></textarea><input id="price" class="input" inputmode="numeric" placeholder="Prix en F CFA"><input id="pubImage" class="input" placeholder="Lien d’une image (facultatif)"><select id="pubCategory" class="input"><option>Produit</option><option>Service</option><option>Formation</option><option>Autre</option></select><input id="pubContact" class="input" placeholder="WhatsApp / téléphone de contact"><div class="grid"><label class="mini"><input type="checkbox" value="Instagram" class="pubPlatform"> 📷 Instagram</label><label class="mini"><input type="checkbox" value="TikTok" class="pubPlatform"> 🎵 TikTok</label><label class="mini"><input type="checkbox" value="WhatsApp" class="pubPlatform"> 💬 WhatsApp</label><label class="mini"><input type="checkbox" value="YouTube" class="pubPlatform"> ▶️ YouTube</label></div><button class="btn green full" onclick="publish()">📣 Publier et créer mon lien</button></div>'}
function publicPublicationHtml(d){let links=d.platforms.map(x=>'<span style="margin-right:10px">'+esc(x)+'</span>').join('');return '<!doctype html><html lang="fr"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(d.name)+'</title><body style="margin:0;font-family:Arial;background:#f5f7fb"><main style="max-width:620px;margin:auto;padding:20px"><article style="background:white;border-radius:22px;overflow:hidden;box-shadow:0 8px 25px #0001">'+(d.image?'<img src="'+esc(d.image)+'" style="width:100%;max-height:340px;object-fit:cover">':'')+'<div style="padding:22px"><div style="font-size:12px;color:#667085">'+esc(d.category)+'</div><h1>'+esc(d.name)+'</h1><p>'+esc(d.desc)+'</p><h2>'+money(d.price)+'</h2><p>📞 '+esc(d.contact||'Contact via SiteMaker')+'</p><p>'+links+'</p><a href="https://wa.me/" style="display:block;text-align:center;background:#16c995;color:white;padding:13px;border-radius:10px;text-decoration:none">💬 Contacter le vendeur</a></div></article></main></body></html>'}
async function publish(){let n=document.getElementById('prod').value.trim(),desc=document.getElementById('pubDesc').value.trim(),p=Number(document.getElementById('price').value),image=(document.getElementById('pubImage')||{}).value||'',category=(document.getElementById('pubCategory')||{}).value||'Produit',contact=(document.getElementById('pubContact')||{}).value||'',platforms=[...document.querySelectorAll('.pubPlatform:checked')].map(x=>x.value);if(!n||!p||!desc)return alert('Renseigne le nom, la description et le prix.');let d={name:n,desc,price:p,image,category,contact,platforms,email:s.user.email};try{let r=await apiFetch('/api/publish-publication',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();if(!r.ok)throw new Error(j.error||'Impossible de publier');let url=j.url;s.publications.push({...d,url,createdAt:new Date().toLocaleString('fr-FR')});s.pubs++;s.activity.push('Publication créée : '+n+' · '+money(p)+' · lien créé');await syncAccount();save();document.getElementById('createArea').innerHTML='<div class="card"><h3>✅ Publication créée</h3><p class="muted">Voici le lien à partager.</p><input class="input" value="'+esc(url)+'" readonly onclick="this.select()"><a class="btn green full" target="_blank" href="'+esc(url)+'">📣 Ouvrir la publication</a><button class="btn white full" style="border:1px solid #d8dee8" onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify(url)+').then(()=>alert(\'Lien copié.\'))">📋 Copier le lien</button></div>';}catch(e){alert(e.message)}}
function copyWave(){if(navigator.clipboard){navigator.clipboard.writeText(C.wave).then(()=>alert('Numéro Wave copié.'));}else{alert('Wave : '+C.wave)}}
async function agent(){let key=prompt('Clé agent :','');if(!key)return;try{let r=await apiFetch('/api/agent/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Accès refusé');let rows=d.requests.length?d.requests.map(x=>'<div class="card"><b>'+esc(x.type==='deposit'?'💳 Dépôt':'↗ Retrait')+' · '+money(x.amount)+'</b><p class="muted">Utilisateur : '+esc(x.email)+'<br>Méthode : '+esc(x.method)+'<br>'+(x.reference?'Référence : '+esc(x.reference):'Destination : '+esc(x.destination))+'<br>Statut : '+requestStatus(x.status)+'</p>'+(x.status==='pending'?'<div class="grid"><button class="btn green" onclick="agentValidate('+JSON.stringify(key)+','+JSON.stringify(x.id)+',\'approve\')">✅ Valider</button><button class="btn white" style="border:1px solid #d8dee8" onclick="agentValidate('+JSON.stringify(key)+','+JSON.stringify(x.id)+',\'reject\')">❌ Refuser</button></div>':'')+'</div>').join(''):'<div class="card"><p class="muted">Aucune demande.</p></div>';document.getElementById('app').innerHTML='<main class="content"><div class="card hero"><span class="tag">AGENT</span><h1>Validation des opérations</h1><p>Un dépôt ou retrait ne modifie jamais le solde avant validation.</p></div>'+rows+'<button class="btn white full" style="border:1px solid #d8dee8" onclick="go(\'dash\')">Retour</button></main>'}catch(e){alert(e.message)}}
async function agentValidate(key,id,action){try{let r=await apiFetch('/api/agent/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,id,action})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');alert(action==='approve'?'Opération validée.':'Opération refusée.');agent()}catch(e){alert(e.message)}}
async function profile(){
  await syncAccount();
  const p=(s.account&&s.account.profile)||s.user||{};
  const safe=v=>esc(v||'');
  document.getElementById('app').innerHTML=shell('<main class="content"><div class="card hero"><span class="tag">👤 MON PROFIL</span><h1>'+safe(p.name||s.user.name)+'</h1><p class="muted">Ton espace personnel SiteMaker. Tes informations restent liées à ton compte.</p></div><div class="card"><h3>📋 Informations du compte</h3><label class="mini">Nom / nom d’utilisateur</label><input id="profileName" class="input" value="'+safe(p.name||s.user.name)+'"><label class="mini">Email</label><input class="input" value="'+safe(s.user.email)+'" readonly><label class="mini">Téléphone</label><input id="profilePhone" class="input" value="'+safe(p.phone||s.user.phone)+'"><label class="mini">WhatsApp</label><input id="profileWhatsapp" class="input" value="'+safe(p.whatsapp||s.user.whatsapp||p.phone||s.user.phone)+'"><label class="mini">Telegram</label><input id="profileTelegram" class="input" value="'+safe(p.telegram)+'"><label class="mini">Instagram</label><input id="profileInstagram" class="input" value="'+safe(p.instagram)+'"><label class="mini">TikTok</label><input id="profileTiktok" class="input" value="'+safe(p.tiktok)+'"><label class="mini">Présentation</label><textarea id="profileBio" class="input" rows="4" placeholder="Présente-toi ou présente ton activité">'+safe(p.bio)+'</textarea><button class="btn primary full" onclick="saveProfile()">💾 Enregistrer mon profil</button></div><div class="grid"><div class="card stat"><b>💰 '+money(s.wallet)+'</b><p class="muted">Solde portefeuille</p></div><div class="card stat"><b>📣 '+s.pubs+'</b><p class="muted">Publications</p></div><div class="card stat"><b>🎓 '+s.courses.length+'</b><p class="muted">Cours</p></div><div class="card stat"><b>🔔 '+s.activity.length+'</b><p class="muted">Notifications</p></div></div><div class="card"><h3>📣 Ma chaîne SiteMaker</h3><p class="muted">Tes produits publiés sont visibles dans Découvrir. Les autres utilisateurs peuvent suivre ta chaîne.</p><button class="btn green full" onclick="showMyChannel()">👥 Voir ma chaîne</button></div><div class="card"><h3>🔐 Mon compte</h3><p class="muted">Compte vérifié par email. Pour toute demande de modification importante, contacte le support.</p><button class="btn white full" style="border:1px solid #d8dee8" onclick="go(\'support\')">🛟 Contacter le support</button></div></main>','profile');
}
async function showMyChannel(){
  try{const r=await apiFetch('/api/channel?email='+encodeURIComponent(s.user.email)+'&viewer='+encodeURIComponent(s.user.email));const d=await r.json();if(!r.ok)throw new Error(d.error||'Chaîne introuvable.');const products=d.products.length?d.products.map(x=>'<div class="activity"><b>'+esc(x.name)+'</b> · '+money(x.price)+'<br><span class="muted">'+esc(x.category)+' · '+esc(x.desc)+'</span><br><a target="_blank" href="'+esc(x.url)+'" onclick="event.stopPropagation()">Voir le produit</a></div>').join(''):'<p class="muted">Aucun produit publié.</p>';document.getElementById('app').innerHTML=shell('<main class="content"><div class="card hero"><span class="tag">📣 MA CHAÎNE</span><h1>'+esc(d.profile.name)+'</h1><p>'+esc(d.profile.bio||'Bienvenue sur ma chaîne SiteMaker.')+'</p><p>👥 '+d.followers+' abonnés</p></div><div class="card"><h3>🛍️ Mes produits</h3>'+products+'</div><button class="btn white full" style="border:1px solid #d8dee8" onclick="go(\'profile\')">Retour au profil</button></main>','profile')}catch(e){alert(e.message)}}
async function saveProfile(){
  const d={email:s.user.email,name:document.getElementById('profileName').value.trim(),phone:document.getElementById('profilePhone').value.trim(),whatsapp:document.getElementById('profileWhatsapp').value.trim(),telegram:document.getElementById('profileTelegram').value.trim(),instagram:document.getElementById('profileInstagram').value.trim(),tiktok:document.getElementById('profileTiktok').value.trim(),bio:document.getElementById('profileBio').value.trim()};
  if(!d.name||!d.whatsapp)return alert('Le nom et WhatsApp sont obligatoires.');
  try{const r=await apiFetch('/api/profile/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Impossible d’enregistrer le profil.');s.user.name=j.profile.name;s.user.phone=j.profile.phone;s.user.whatsapp=j.profile.whatsapp;s.account={...(s.account||{}),profile:j.profile};save();alert('Profil enregistré.');profile();}catch(e){alert(e.message)}
}
function support(){document.getElementById('app').innerHTML=shell('<main class="content"><div class="card"><span class="tag">SUPPORT</span><h2>Besoin d’aide ?</h2><p>Tu peux contacter le support pour ton compte, ton portefeuille ou tes publications.</p><a class="btn primary full" href="mailto:'+C.email+'">✉ Écrire au support</a><button class="btn white full" style="border:1px solid #d8dee8" onclick="agent()">🧑‍💼 Espace agent</button><button class="btn white full" style="border:1px solid #d8dee8" onclick="developer()">🛠️ Option développeur</button></div>'+contactsBlock()+'<div class="card"><h3>🔔 Notifications support</h3><div class="notification-list">'+(s.activity.length?s.activity.slice().reverse().map(x=>'<div class="notification-item">🔔 '+esc(x)+'</div>').join(''):'<div class="notification-item muted">Aucune notification.</div>')+'</div></div></main>','support')}
window.emailLogin=emailLogin;window.googleLogin=googleLogin;window.signupGo=signupGo;window.genCode=genCode;window.verify=verify;window.go=go;window.newCourse=newCourse;window.deposit=deposit;window.withdraw=withdraw;window.publish=publish;window.saveSite=saveSite;window.siteWizard=siteWizard;window.publicationForm=publicationForm;window.previewSite=previewSite;window.render=render;window.showNotifications=showNotifications;window.showWave=showWave;window.copyWave=copyWave;window.openWaveApp=openWaveApp;window.agent=agent;window.agentValidate=agentValidate;window.developer=developer;window.buyCreationCredit=buyCreationCredit;window.profile=profile;window.saveProfile=saveProfile;window.discover=discover;window.toggleFollow=toggleFollow;window.showMyChannel=showMyChannel;window.showCardDetail=showCardDetail;window.closeCardDetail=closeCardDetail;
render();
})();
</script></body></html>
